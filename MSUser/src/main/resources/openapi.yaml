openapi: 3.0.0
info:
  title: API de Gestión de Usuarios
  description: Este microservicio expone endpoints para gestionar usuarios del sistema.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo

paths:
  /user/create:
    post:
      tags:
        - Usuarios
      summary: Crear usuario
      description: Crea un nuevo usuario en el sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/all:
    get:
      tags:
        - Usuarios
      summary: Obtener todos los usuarios
      description: Retorna una lista de todos los usuarios registrados
      responses:
        '200':
          description: Lista de usuarios recuperada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/by-id/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por ID
      description: Retorna un usuario específico basado en su ID
      parameters:
        - name: id
          in: path
          description: ID del usuario
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/delete/{id}:
    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      description: Elimina un usuario específico basado en su ID
      parameters:
        - name: id
          in: path
          description: ID del usuario a eliminar
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/update:
    put:
      tags:
        - Usuarios
      summary: Actualizar usuario
      description: Actualiza los datos de un usuario existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - nombres
        - apellidos
        - rut
        - dv
        - fechaNacimiento
        - correoElectronico
        - contrasena
      properties:
        nombres:
          type: string
          example: "Juan Pablo"
          description: Nombres del usuario
        apellidos:
          type: string
          example: "Saldarriaga"
          description: Apellidos del usuario
        rut:
          type: string
          example: "12345678"
          description: RUT sin dígito verificador
        dv:
          type: string
          example: "K"
          description: Dígito verificador del RUT
        fechaNacimiento:
          type: string
          format: date
          example: "1990-01-01"
          description: Fecha de nacimiento
        correoElectronico:
          type: string
          format: email
          example: "juan.saldarriaga@ejemplo.com"
          description: Correo electrónico
        contrasena:
          type: string
          example: "Abc123**"
          description: Contraseña del usuario

    UpdateUserRequest:
      allOf:
        - $ref: '#/components/schemas/CreateUserRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
              description: ID del usuario a actualizar

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombres:
          type: string
          example: "Juan Pablo"
        apellidos:
          type: string
          example: "Saldarriaga"
        rut:
          type: string
          example: "12345678"
        dv:
          type: string
          example: "K"
        fechaNacimiento:
          type: string
          format: date
          example: "1990-01-01"
        correoElectronico:
          type: string
          example: "juan.saldarriaga@ejemplo.com"

    ApiResponse:
      type: object
      properties:
        statusCode:
          type: string
          example: "200"
        isSuccess:
          type: boolean
          example: true
        transactionDate:
          type: string
          format: date-time
        message:
          type: string
          example: "Transacción exitosa"
        data:
          $ref: '#/components/schemas/UserResponse'

    UsersResponse:
      type: object
      properties:
        statusCode:
          type: string
          example: "200"
        isSuccess:
          type: boolean
          example: true
        transactionDate:
          type: string
          format: date-time
        message:
          type: string
          example: "Transacción exitosa"
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: string
          example: "400"
        isSuccess:
          type: boolean
          example: false
        transactionDate:
          type: string
          format: date-time
        message:
          type: string
          example: "Error en la operación"
        data:
          type: object
          nullable: true 